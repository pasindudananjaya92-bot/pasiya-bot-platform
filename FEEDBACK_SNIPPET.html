<!-- Optional: paste into index.html -->
<section id="siteFeedback" style="margin:16px;padding:16px;border:1px solid rgba(0,229,255,.35);border-radius:14px;max-width:520px">
  <h3 style="color:#00e5ff;margin:0 0 8px">💬 Feedback</h3>
  <p style="opacity:.8;font-size:13px">Saves to MongoDB pasiya_db.feedback</p>
  <input id="sfName" placeholder="Name (optional)" style="width:100%;margin:6px 0;padding:10px;border-radius:10px;background:#0a1520;color:#fff;border:1px solid #0ff5">
  <input id="sfEmail" placeholder="Email (optional)" style="width:100%;margin:6px 0;padding:10px;border-radius:10px;background:#0a1520;color:#fff;border:1px solid #0ff5">
  <textarea id="sfMsg" placeholder="Message *" rows="3" style="width:100%;margin:6px 0;padding:10px;border-radius:10px;background:#0a1520;color:#fff;border:1px solid #0ff5"></textarea>
  <button type="button" id="sfBtn" style="padding:12px 16px;border:0;border-radius:10px;background:#00e5ff;color:#001;font-weight:800">Send</button>
  <div id="sfStatus" style="margin-top:8px;font-size:13px;color:#9ef"></div>
  <p style="margin-top:8px;font-size:12px"><a href="feedback.html" style="color:#00e5ff">Full feedback page →</a></p>
</section>
<script>
(function(){
  var API=/github\.io/i.test(location.hostname)?'https://pasiya-bot-platform.vercel.app':'';
  var b=document.getElementById('sfBtn');
  if(!b) return;
  b.onclick=function(){
    var msg=(document.getElementById('sfMsg').value||'').trim();
    var st=document.getElementById('sfStatus');
    if(!msg){ st.textContent='Write a message'; return; }
    st.textContent='Sending…';
    fetch(API+'/api/feedback',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        name:document.getElementById('sfName').value||'',
        email:document.getElementById('sfEmail').value||'',
        message:msg,
        type:'feedback',
        source:'index-snippet'
      })
    }).then(function(r){return r.json()}).then(function(d){
      st.textContent=d.success?'✅ Saved!':('Error: '+(d.error||''));
      if(d.success){ document.getElementById('sfMsg').value=''; }
    }).catch(function(e){ st.textContent=String(e.message||e); });
  };
})();
</script>
