<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasiya · Feedback</title>
<style>
  :root { --c:#00e5ff; --bg:#070b14; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at top, #10254f, var(--bg));
    color: #e8f7ff; min-height: 100vh; padding: 24px 16px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { color: var(--c); font-size: 1.3rem; margin: 12px 0 8px; }
  p { opacity: .8; font-size: .9rem; margin-bottom: 16px; }
  label { display: block; font-size: 13px; margin: 10px 0 4px; opacity: .9; }
  input, textarea {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,229,255,.35);
    background: rgba(0,10,20,.85); color: #fff; font-size: 16px;
  }
  textarea { min-height: 120px; resize: vertical; }
  button {
    margin-top: 14px; width: 100%; padding: 14px; border: 0; border-radius: 12px;
    background: var(--c); color: #001018; font-weight: 800; font-size: 16px; cursor: pointer;
  }
  #status { margin-top: 12px; min-height: 1.4em; font-size: 14px; color: #9ef; }
  a { color: var(--c); }
</style>
</head>
<body>
  <div class="wrap">
    <a href="./">← Back</a>
    <h1>💬 Send Feedback</h1>
    <p>Saved to MongoDB <b>pasiya_db.feedback</b> via Vercel API</p>
    <form id="fbForm">
      <label>Name (optional)</label>
      <input id="fbName" name="name" autocomplete="name" placeholder="Your name">
      <label>Email (optional)</label>
      <input id="fbEmail" name="email" type="email" autocomplete="email" placeholder="you@email.com">
      <label>Message *</label>
      <textarea id="fbMsg" name="message" required placeholder="Your message…"></textarea>
      <button type="submit">Send Feedback</button>
    </form>
    <div id="status"></div>
  </div>
<script>
(function () {
  var API = /github\.io/i.test(location.hostname)
    ? 'https://pasiya-bot-platform.vercel.app'
    : '';
  document.getElementById('fbForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var st = document.getElementById('status');
    var message = (document.getElementById('fbMsg').value || '').trim();
    if (!message) { st.textContent = 'Please write a message'; return; }
    st.textContent = 'Sending…';
    try {
      var res = await fetch(API + '/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('fbName').value || '',
          email: document.getElementById('fbEmail').value || '',
          message: message,
          type: 'feedback',
          source: 'feedback.html'
        })
      });
      var data = await res.json();
      if (data.success) {
        st.textContent = '✅ Saved! Thank you.';
        document.getElementById('fbForm').reset();
      } else {
        st.textContent = 'Error: ' + (data.error || res.status);
      }
    } catch (err) {
      st.textContent = 'Network error: ' + (err.message || err);
    }
  });
})();
</script>
</body>
</html>
