<!-- Paste this block into index.html (e.g. inside a tools/settings section) -->
<section id="user-search" class="panel" style="margin:16px 0;padding:16px;border:1px solid rgba(0,229,255,.3);border-radius:14px">
  <h3>🔍 User Search (Atlas Fuzzy)</h3>
  <p style="opacity:.8;font-size:13px">Queries pasiya_db.users via Vercel /api/search-users</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
    <input id="atlasSearchQ" placeholder="Search users…" style="flex:1;min-width:160px;padding:10px;border-radius:10px;background:#0a1520;color:#fff;border:1px solid #0ff5">
    <button type="button" id="atlasSearchBtn" style="padding:10px 16px;border-radius:10px;border:0;background:#00e5ff;color:#001018;font-weight:700">Search</button>
  </div>
  <div id="atlasSearchStatus" style="min-height:1.2em;font-size:13px;color:#9ef"></div>
  <div id="atlasSearchOut"></div>
  <p style="margin-top:8px;font-size:12px"><a href="search.html" style="color:#00e5ff">Open full search page →</a></p>
</section>
<script>
(function () {
  var API = /github\.io/i.test(location.hostname)
    ? 'https://pasiya-bot-platform.vercel.app'
    : '';
  function run() {
    var q = (document.getElementById('atlasSearchQ').value || '').trim();
    var st = document.getElementById('atlasSearchStatus');
    var out = document.getElementById('atlasSearchOut');
    if (!q) { st.textContent = 'Type a query'; return; }
    st.textContent = 'Searching…';
    fetch(API + '/api/search-users?q=' + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.success) { st.textContent = d.error || 'Error'; return; }
        st.textContent = d.count + ' result(s)';
        out.innerHTML = (d.results || []).map(function (r) {
          return '<div style="padding:8px;margin:6px 0;border:1px solid rgba(0,229,255,.3);border-radius:8px"><b>' +
            (r.name || r.username || r.email || r._id) + '</b><br><small>' +
            [r.username, r.email, r.bio].filter(Boolean).join(' · ') + '</small></div>';
        }).join('') || '<p>No matches</p>';
      })
      .catch(function (e) { st.textContent = String(e.message || e); });
  }
  var b = document.getElementById('atlasSearchBtn');
  if (b) b.onclick = run;
  var i = document.getElementById('atlasSearchQ');
  if (i) i.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
})();
</script>
