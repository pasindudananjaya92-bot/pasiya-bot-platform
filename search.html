<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasiya · User Fuzzy Search</title>
<style>
  :root { --bg:#070b14; --c:#00e5ff; --t:#e8f7ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #10254f, var(--bg));
    color: var(--t);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { color: var(--c); font-size: 1.35rem; margin: 12px 0 8px; }
  .hint { opacity: 0.75; font-size: 0.9rem; margin-bottom: 16px; line-height: 1.45; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  input[type="search"] {
    flex: 1;
    min-width: 180px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(0, 229, 255, 0.35);
    background: rgba(0, 10, 20, 0.85);
    color: #fff;
    font-size: 16px;
  }
  button {
    padding: 12px 18px;
    border-radius: 12px;
    border: 0;
    background: var(--c);
    color: #001018;
    font-weight: 700;
    cursor: pointer;
  }
  .status { min-height: 1.4em; font-size: 0.85rem; margin-bottom: 12px; color: #9ef; }
  .card {
    background: rgba(0, 20, 40, 0.7);
    border: 1px solid rgba(0, 229, 255, 0.25);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .card h3 { font-size: 1rem; color: var(--c); }
  .card p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }
  .score { font-size: 0.75rem; opacity: 0.6; margin-top: 4px; }
  a.home { color: var(--c); font-size: 0.85rem; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="home" href="./">← Back to site</a>
    <h1>🔍 User Fuzzy Search</h1>
    <p class="hint">
      MongoDB Atlas Search · DB <b>pasiya_db</b> · collection <b>users</b> · index <b>default</b><br>
      API: <code>/api/search-users?q=...</code> (runs on Vercel)
    </p>
    <div class="bar">
      <input id="q" type="search" placeholder="Type name, email, username…" autocomplete="off">
      <button type="button" id="btn">Search</button>
    </div>
    <div class="status" id="status">Ready — type and search</div>
    <div id="out"></div>
  </div>
<script>
(function () {
  var API_BASE = '';
  if (/github\.io/i.test(location.hostname)) {
    API_BASE = 'https://pasiya-bot-platform.vercel.app';
  }

  var qEl = document.getElementById('q');
  var out = document.getElementById('out');
  var status = document.getElementById('status');
  var timer = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  async function run() {
    var q = (qEl.value || '').trim();
    if (!q) {
      status.textContent = 'Type something to search';
      out.innerHTML = '';
      return;
    }
    status.textContent = 'Searching…';
    out.innerHTML = '';
    try {
      var url = API_BASE + '/api/search-users?q=' + encodeURIComponent(q) + '&limit=20';
      var res = await fetch(url);
      var data = await res.json();
      if (!data.success) {
        status.textContent = 'Error: ' + (data.error || ('HTTP ' + res.status));
        return;
      }
      status.textContent = data.count + ' result(s) for “' + data.query + '”' + (data.mode ? ' [' + data.mode + ']' : '');
      if (!data.results || !data.results.length) {
        out.innerHTML = '<div class="card"><p>No matches. Add documents in Atlas → pasiya_db → users</p></div>';
        return;
      }
      out.innerHTML = data.results.map(function (r) {
        var title = r.name || r.username || r.email || r._id;
        var bits = [r.username, r.email, r.bio, r.role].filter(Boolean).join(' · ');
        var score = r.score != null ? '<div class="score">score: ' + Number(r.score).toFixed(3) + '</div>' : '';
        return '<div class="card"><h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(bits) + '</p>' + score + '</div>';
      }).join('');
    } catch (e) {
      status.textContent = 'Network error: ' + (e.message || e);
    }
  }

  document.getElementById('btn').onclick = run;
  qEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') run();
  });
  qEl.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(run, 450);
  });
})();
</script>
</body>
</html>
